<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Add Task</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>
<body>
    <div class="card">
        <h2>Add Task</h2>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="actions">
                <button type="submit">Add</button>
                <a href="{% url 'todo-detail' view.kwargs.pk %}">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
